<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#020617" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#010103" />
    </radialGradient>

    <!-- Neon Cyan & Violet Glow Gradients -->
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="facetGlass" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#010103" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter for Retina / Browser Tabs -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Obsidian Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="1" />

  <!-- Ambient Light Core -->
  <circle cx="32" cy="32" r="16" fill="#06b6d4" opacity="0.15" filter="url(#neonGlow)" />
  <circle cx="32" cy="32" r="8" fill="#8b5cf6" opacity="0.25" filter="url(#neonGlow)" />

  <!-- Outer Isometric Obsidian Monolith Diamond -->
  <path
    d="M32 8 L54 32 L32 56 L10 32 Z"
    fill="url(#facetGlass)"
    stroke="url(#cyanViolet)"
    stroke-width="2.5"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Internal Monolith Geometric Facets -->
  <path
    d="M32 8 L32 56"
    stroke="#22d3ee"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.85"
  />
  <path
    d="M10 32 L54 32"
    stroke="#8b5cf6"
    stroke-width="1.25"
    opacity="0.65"
  />

  <!-- Central Crystalline Core / Node (❖) -->
  <polygon
    points="32,20 44,32 32,44 20,32"
    fill="#020617"
    stroke="#38bdf8"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
  
  <!-- Specular Reflection Highlight -->
  <polygon
    points="32,20 44,32 32,32"
    fill="#ffffff"
    opacity="0.2"
  />

  <circle cx="32" cy="32" r="2" fill="#ffffff" filter="url(#neonGlow)" />
</svg>
